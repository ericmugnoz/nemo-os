; MENU.CFG -- el menu de Inicio de Nemo OS
;
; Formato, una orden por linea:
;
;   seccion NOMBRE ICONO
;     item NOMBRE DESTINO ICONO
;
; El NOMBRE no lleva espacios. El DESTINO es el programa a lanzar: un
; .pro, o un .lua (el kernel lo redirige a LUA.PRO). El ICONO es el
; numero del catalogo; la lista esta en GUIA_ICONOS.md y el editor del
; escritorio los enseña todos.
;
; Apagar y Reiniciar NO se ponen aqui: van siempre al final, porque un
; menu sin forma de apagar dejaria el sistema sin salida.
;
; Si este archivo falta o esta mal, el sistema usa su menu de serie.

